    <path d="M180 52 V448M360 52 V448M540 52 V448M720 52 V448M900 52 V448M1080 52 V448M1260 52 V448M1440 52 V448"/>
  </g>

  <rect x="82" y="76" width="10" height="348" rx="5" fill="url(#accent)" filter="url(#glow)"/>

  <text x="135" y="155" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#94A3B8" letter-spacing="4">CYBERSECURITY CAPSTONE</text>
