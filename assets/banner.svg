    <rect x="365" y="338" width="240" height="54" rx="27" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="485" y="373" text-anchor="middle" fill="#7DD3FC">8 FINDINGS</text>

    <rect x="625" y="338" width="270" height="54" rx="27" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
