<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#A78BFA"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="88" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#F8FAFC">Server 2 — From Public Files to Sensitive Backup</text>
  <text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#94A3B8">192.168.100.107 · 02 October 2026</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="150" y="220" width="300" height="100" rx="18" fill="#2E1065" stroke="#8B5CF6" stroke-width="2"/>
    <text x="300" y="260" text-anchor="middle" font-size="23" font-weight="800" fill="#F5F3FF">ANONYMOUS FTP</text>
    <text x="300" y="292" text-anchor="middle" font-size="18" fill="#C4B5FD">unauthenticated access</text>

    <line x1="450" y1="270" x2="545" y2="270" stroke="#A78BFA" stroke-width="4" marker-end="url(#a)"/>

    <rect x="560" y="220" width="300" height="100" rx="18" fill="#0B1220" stroke="#8B5CF6"/>
    <text x="710" y="258" text-anchor="middle" font-size="22" fill="#E2E8F0">Sensitive File</text>
    <text x="710" y="291" text-anchor="middle" font-size="18" fill="#94A3B8">maintenance-account.txt</text>

    <line x1="860" y1="270" x2="955" y2="270" stroke="#A78BFA" stroke-width="4" marker-end="url(#a)"/>

    <rect x="970" y="220" width="300" height="100" rx="18" fill="#0B1220" stroke="#8B5CF6"/>
    <text x="1120" y="258" text-anchor="middle" font-size="22" fill="#E2E8F0">Plaintext Credential</text>
    <text x="1120" y="291" text-anchor="middle" font-size="18" fill="#94A3B8">active support account</text>

    <line x1="1120" y1="320" x2="1120" y2="405" stroke="#A78BFA" stroke-width="4" marker-end="url(#a)"/>

    <rect x="970" y="420" width="300" height="100" rx="18" fill="#0B1220" stroke="#8B5CF6"/>
    <text x="1120" y="458" text-anchor="middle" font-size="22" fill="#E2E8F0">phpMyFAQ Login</text>
    <text x="1120" y="491" text-anchor="middle" font-size="18" fill="#94A3B8">valid authentication</text>

    <line x1="970" y1="470" x2="875" y2="470" stroke="#A78BFA" stroke-width="4" marker-end="url(#a)"/>

    <rect x="560" y="420" width="300" height="100" rx="18" fill="#0B1220" stroke="#8B5CF6"/>
    <text x="710" y="458" text-anchor="middle" font-size="22" fill="#E2E8F0">Low-Privilege Session</text>
    <text x="710" y="491" text-anchor="middle" font-size="18" fill="#94A3B8">authenticated ≠ authorized</text>

    <line x1="560" y1="470" x2="465" y2="470" stroke="#A78BFA" stroke-width="4" marker-end="url(#a)"/>

    <rect x="150" y="420" width="300" height="100" rx="18" fill="#0B1220" stroke="#8B5CF6"/>
    <text x="300" y="456" text-anchor="middle" font-size="21" fill="#E2E8F0">/api/setup/backup</text>
    <text x="300" y="489" text-anchor="middle" font-size="18" fill="#94A3B8">insufficient authorization</text>

    <line x1="300" y1="520" x2="300" y2="605" stroke="#A78BFA" stroke-width="4" marker-end="url(#a)"/>

    <rect x="150" y="620" width="1120" height="118" rx="22" fill="#2E1065" stroke="#8B5CF6" stroke-width="2"/>
    <text x="710" y="665" text-anchor="middle" font-size="25" font-weight="800" fill="#F5F3FF">SENSITIVE CONFIGURATION BACKUP</text>
    <text x="710" y="703" text-anchor="middle" font-size="19" fill="#C4B5FD">The vulnerability was authorization failure after successful authentication</text>

    <rect x="150" y="780" width="1120" height="64" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="710" y="820" text-anchor="middle" font-size="19" fill="#94A3B8">Key distinction: unauthenticated request → 401 · authenticated low-privileged request → backup created</text>
  </g>
</svg>